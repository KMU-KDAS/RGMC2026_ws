camera:
  record: true
  fps: 2.5
  record_only_after_action: false
  save_images_individually: true

experiment:
  name: "rope_calibration_notebook"
  robot_idx: "robot17"
  timeout_between_experiments: 2.0
  time_between_orders: 1.5
  grasper_type: "rope_calibration"
  robot_home_xy: [0.5, 0.5]


rope_calibration:
  grid_size: 33
  x_min: 0.02
  x_max: 0.96
  y_min: 0.0
  y_max: 1.0
  frames_per_point: 5
  settle_time_sec: 0.7
  inter_frame_sec: 0.05
  reverse_xy: false
  resume: true
  save_masks: true
  write_debug_json: true
  output_subdir: "rope_calibration"
  custom_points: null
  planar_only: true
  prefer_raw_base_image: true
  min_valid_frames: 3
  aggregate_mode: "median"

  detector_lower_hsv: [10, 120, 120]
  detector_upper_hsv: [15, 255, 255]
  detector_kernel_size: 5
  detector_min_area: 100
